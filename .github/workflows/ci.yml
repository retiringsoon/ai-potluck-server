# CI for the ai-potluck-server package: ruff, mypy --strict, and the pytest
# suite on the two Python versions the project supports (>=3.11).
#
# Until ai-potluck is published to a package index, the job checks out the
# companion repository beside this one and installs it from source; once the
# client package is on an index, the second checkout and the extra install
# argument go away and `uv pip install -e ".[dev]"` resolves it by itself.
#
# pytest's system temp directory is writable on a normal CI runner, so no
# --basetemp override is needed here (the sandboxed local runs are the ones
# that require it). The suite runs under xdist because it is parallel-safe: each
# server binds port 0 and each test owns its temporary directory, so the workers
# share nothing but the CPU.

name: ci

on:
  push:
    paths:
      - "**"
  pull_request:
    paths:
      - "**"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Check out ai-potluck
        uses: actions/checkout@v4
        with:
          repository: retiringsoon/ai-potluck
          path: ai-potluck

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ./ai-potluck -e ".[dev]"

      - name: ruff
        run: .venv/bin/ruff check src/ tests/

      - name: mypy
        run: .venv/bin/mypy

      - name: pytest
        run: .venv/bin/python -m pytest tests/ -q -n auto
